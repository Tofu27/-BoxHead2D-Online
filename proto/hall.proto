syntax = "proto3";

package packets;

option go_package = "pkg/packets";

import "common.proto";

// 房间信息
message RoomInfo {
    uint64 room_id = 1;
    string name = 2;
    uint32 player_count = 3;
    uint32 max_players = 4;
    User   room_owner = 5; // 房主信息
}

// ===== 请求/响应 =====

// 获取房间列表
message RoomListRequest {}
message RoomListResponse {
    repeated RoomInfo rooms = 1;
}

// 创建房间
message CreateRoomRequest {
    string name = 1;
    uint32 max_players = 2;
}
message CreateRoomResponse {
    bool success = 1;
    string reason = 2;
    RoomInfo room = 3;
}

// 加入房间
message JoinRoomRequest {
    uint64 room_id = 1;
}
message JoinRoomResponse {
    bool success = 1;
    string reason = 2;
    RoomInfo room = 3;
}

// ===== 服务端主动推送 =====

// 房间列表增量更新（广播给大厅内所有玩家）
message RoomListUpdate {
    repeated RoomInfo added = 1;
    repeated uint64 removed = 2;
}

// 玩家成功进入房间后，服务端下发的通知
message RoomJoined {
    RoomInfo room = 1;
    repeated User users = 2; // 房间内所有玩家
}