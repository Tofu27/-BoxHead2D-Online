syntax = "proto3";

package packets;

option go_package = "pkg/packets";

import "common.proto";

// 房间信息
message RoomInfo {
    uint64 room_id = 1;
    string name = 2;
    uint32 player_count = 3;
    uint32 max_players = 4;
    User room_owner = 5; // 房主信息
}

// ---------- 客户端请求 ----------

// 创建房间（客户端可选，但本流程由服务端自动创建，可保留备用）
message CreateRoomRequest {
    string name = 1;
    uint32 max_players = 2;
}
message CreateRoomResponse {
    bool success = 1;
    string reason = 2;
    RoomInfo room = 3;
}

// 加入房间（客户端可选）
message JoinRoomRequest {
    uint64 room_id = 1;
}
message JoinRoomResponse {
    bool success = 1;
    string reason = 2;
    RoomInfo room = 3;
}

// 离开房间
message LeaveRoomRequest {}

// 开始游戏（房主发起）
message StartGameRequest {}

// ---------- 服务端推送 ----------

// 房间加入/更新通知（包含完整房间信息和玩家列表）
message RoomJoined {
    RoomInfo room = 1;
    repeated User users = 2; // 当前房间内所有玩家
}