syntax = "proto3";

package packets;

option go_package = "pkg/packets";

import "common.proto";

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    bool success = 1;
    string reason = 2;
    User user = 3;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}