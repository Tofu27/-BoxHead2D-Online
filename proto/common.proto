syntax = "proto3";

package packets;

option go_package = "pkg/packets";

message User {
    uint64 id = 1;
    string username = 2;
}

message IdMessage {
    uint64 client_id = 1;
}

message ChatMessage {
    string msg = 1;
}

message DenyResponse {
    string reason = 1;
}

message OkResponse {}

message DisconnectMessage {
    string reason = 1;
}